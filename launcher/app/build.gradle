plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 136
        versionName '1.3.6'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Local builds use this machine\u0027s debug key; distributors must configure and protect their own release signing key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.media:media:1.7.0'
    // Compatible with the existing compileSdk 34 / Android 9 device.
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}

android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/updateAgentAssets'))
tasks.register('prepareUpdateAgent', Copy) {
 dependsOn ':updateagent:assembleDebug'
 from(project(':updateagent').layout.buildDirectory.file('outputs/apk/debug/updateagent-debug.apk'))
 into(layout.buildDirectory.dir('generated/updateAgentAssets'))
 rename { 'update-agent.apk' }
}
tasks.named('preBuild').configure { dependsOn 'prepareUpdateAgent' }

// Reuse the shipped offline map in JVM tests without duplicating it.
android.sourceSets.test.resources.srcDir('src/main/assets/timezone')
android.sourceSets.test.resources.srcDir('src/main/assets/geography')
