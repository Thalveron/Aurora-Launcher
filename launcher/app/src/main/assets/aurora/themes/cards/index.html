<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora · 简约卡片</title><link rel="stylesheet" href="/themes/foundation/theme.css"><link rel="stylesheet" href="/core/presentation.css"><link rel="stylesheet" href="/themes/cards/theme.css"><script src="/themes/cards/free-layout.js"></script></head><body data-home-focus="#apps .app">
<main><header><section><div id="clock">--:--</div><div class="calendar"><p id="date"></p><p id="lunar"></p></div></section><section class="weather"><div class="current-weather"><div id="weather-symbol"></div><div><small id="city">天气</small><h2 id="weather">--°</h2><small id="weather-description"></small></div></div><div id="forecast"></div></section></header>
<section class="middle"><article class="music"><div class="track-head"><div class="cover-wrap"><span class="cover-placeholder"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M40 65V25l37-8v42M40 34l37-8M40 65c0 15-26 19-26 6s26-18 26-6M77 59c0 15-26 19-26 6s26-18 26-6" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/></svg></span><img id="cover" alt="专辑封面" hidden></div><div class="track-meta"><p class="eyebrow">正在播放</p><h1 id="song">选择一首喜欢的歌</h1><p id="artist">Aurora Music</p></div><button id="open-player" data-focus-id="open-player" aria-label="打开音乐播放器" title="打开音乐播放器">↗</button></div><p id="lyric"></p><div class="seek-line"><span id="elapsed">0:00</span><progress id="progress" max="100" value="0" tabindex="0" data-focus-id="seek" aria-label="播放进度，确认后调整"></progress><span id="duration">0:00</span></div><div class="controls"><button id="mode-cycle" data-focus-id="mode-cycle" disabled></button><button id="prev" data-focus-id="prev" disabled></button><button id="play" data-focus-id="play" disabled></button><button id="next" data-focus-id="next" disabled></button><button id="queue" data-focus-id="queue"></button></div></article>
<aside class="system-card"><h2>系统状态</h2><div class="meter-label"><span>存储空间</span><span id="storage-value">--</span></div><progress id="storage-meter" max="100" value="0"></progress><div class="meter-label"><span>内存占用</span><span id="memory-value">--</span></div><progress id="memory-meter" max="100" value="0"></progress><small id="network-status">正在读取系统状态</small></aside></section>
<section class="apps-card"><button class="card-heading" id="all-apps" data-focus-id="all-apps">我的应用 <span>→</span></button><div id="apps"></div></section>
<section class="quick-card" data-area="shortcuts"><h2>快捷功能 <span>→</span></h2><div class="quick-items"><button id="wifi" data-focus-id="wifi" aria-label="网络设置"></button><button id="bluetooth" data-focus-id="bluetooth" aria-label="蓝牙设置"></button><button id="display" data-focus-id="display" aria-label="显示设置"></button><button id="power" data-focus-id="power" aria-label="电视待机"></button></div></section>
<section class="detail-weather" data-area="detail"><h2>天气信息</h2><div class="detail-weather-body"><div><span id="detail-city">--</span><strong id="detail-temperature">--°</strong><small id="detail-description"></small><small id="detail-range"></small></div><div id="detail-symbol"></div></div></section>
<div class="top-tools"><button id="top-wifi" data-focus-id="top-wifi" aria-label="网络设置"></button><button id="top-bluetooth" data-focus-id="top-bluetooth" aria-label="蓝牙设置"></button><button id="native-home" data-focus-id="native-home" aria-label="主题设置"></button><button id="top-power" data-focus-id="top-power" aria-label="电视待机"></button></div><footer id="mode"></footer></main><div id="notice" role="status" hidden></div>
<script src="/core/i18n.js"></script><script src="/core/mock.js"></script><script src="/core/api.js"></script><script src="/core/focus.js"></script><script src="/core/presentation.js"></script><script src="/themes/cards/theme.js"></script></body></html>
